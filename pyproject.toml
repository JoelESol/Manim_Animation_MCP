[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "animation-mcp"
version = "0.1.0"
description = "MCP server that lets agents create animations and drawings with Manim"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "manim>=0.18,<1.0",
    "mcp[cli]>=1.2",
]

[project.scripts]
animation-mcp = "animation_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
